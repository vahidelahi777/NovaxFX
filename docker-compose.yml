services:
  postgres:
    image: postgres:16-alpine
    container_name: novax-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  prod-daemon:
    build: .
    container_name: novax-prod-daemon
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: >
      python scripts/prod_daemon_xauusd.py
      --symbol XAUUSD
      --state-dir data/
      --log-file logs/daemon_XAUUSD.log
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "find /app/data/heartbeat -mmin -20 | grep -q heartbeat"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  product-bot:
    build: .
    container_name: novax-product-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./logs:/app/logs
    command: python scripts/run_bot.py
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  channel-aggregator:
    build:
      context: .
      dockerfile: Dockerfile.aggregator
    container_name: novax-channel-aggregator
    profiles: ["aggregator"]
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: >
      python scripts/channel_aggregator.py
      --channels ${SOURCE_CHANNELS}
      --session-file data/aggregator.session
      --log-file logs/aggregator.log

  weekly-analysis:
    build: .
    container_name: novax-weekly-analysis
    profiles: ["weekly"]
    env_file: .env
    volumes:
      - ./data:/app/data
    command: python scripts/weekly_analysis.py --symbol XAUUSD
    restart: "no"

volumes:
  postgres_data:
