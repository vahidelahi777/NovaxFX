[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "novax"
version = "0.0.1"
description = "Novax FX Platform — Phase 0 research scaffold (research-only, no live capital)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Novax" }]
dependencies = [
    "pyarrow>=14.0",
    "duckdb>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "tzdata>=2024",
]
prod = [
    "pyarrow>=14.0",
    "duckdb>=0.10",
]
dashboard = [
    "streamlit>=1.27",
    "pandas>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/novax"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/novax"]
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "duckdb"]
ignore_missing_imports = true
