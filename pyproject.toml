[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "novax"
version = "0.0.1"
description = "Novax FX Platform — Phase 0 research scaffold (research-only, no live capital)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Novax" }]
dependencies = [
    "pyarrow>=14.0",
    "duckdb>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "tzdata>=2024",
]
prod = [
    "pyarrow>=14.0",
    "duckdb>=0.10",
    "python-telegram-bot>=21.0",
    "psycopg[binary]>=3.1",
]
aggregator = [
    "telethon>=1.36",
    "anthropic>=0.30",
]
dashboard = [
    "streamlit>=1.27",
    "pandas>=2.0",
]
admin = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "itsdangerous>=2.1",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/novax"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/novax"]
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "duckdb"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["telethon", "telethon.*", "anthropic", "anthropic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["telegram", "telegram.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["psycopg", "psycopg.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pyarrow ships its own type stubs starting with newer releases.
# On older installs the stubs are absent and no-untyped-call fires;
# on newer installs it doesn't fire and warn_unused_ignores would flag
# the comments.  Disable warn_unused_ignores here to handle both cases.
module = ["novax.data.storage.parquet_store"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["uvicorn", "uvicorn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["argon2", "argon2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["itsdangerous", "itsdangerous.*"]
ignore_missing_imports = true
