{% extends "base.html" %}
{% block title %}Login — NovaxFX Admin{% endblock %}

{% block extra_head %}
<style>
  body { display: flex; align-items: center; justify-content: center; }
  .login-card {
    background: #fff; border-radius: 10px; padding: 2.5rem 2rem;
    box-shadow: 0 4px 20px rgba(0,0,0,.1); width: 100%; max-width: 380px;
  }
  .login-card h1 { font-size: 1.4rem; text-align: center; margin-bottom: 1.75rem; }
  label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: .3rem; color: #555; }
  input[type=password] {
    width: 100%; padding: .65rem .85rem; border: 1px solid #ced4da;
    border-radius: 6px; font-size: .95rem; outline: none; margin-bottom: 1.1rem;
    transition: border-color .15s;
  }
  input[type=password]:focus { border-color: #4a90e2; }
  .btn-primary {
    width: 100%; padding: .7rem; background: #1a1a2e; color: #fff;
    border: none; border-radius: 6px; font-size: 1rem; cursor: pointer;
    transition: opacity .15s;
  }
  .btn-primary:hover { opacity: .85; }
  .error-msg {
    background: #f8d7da; color: #721c24; border-radius: 6px;
    padding: .6rem .85rem; font-size: .85rem; margin-bottom: 1rem;
  }
</style>
{% endblock %}

{% block content %}
<div class="login-card">
  <h1>🔐 Admin Login</h1>

  {% if error %}
  <div class="error-msg" role="alert">{{ error }}</div>
  {% endif %}

  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password"
           autofocus required>
    <button type="submit" class="btn-primary">Sign in</button>
  </form>
</div>
{% endblock %}
