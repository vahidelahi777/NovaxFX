name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # ── Static analysis ────────────────────────────────────────────────────
      - name: Format check (ruff format)
        run: ruff format --check src tests

      - name: Lint (ruff check)
        run: ruff check src tests

      - name: Type-check (mypy)
        run: mypy

      - name: Platform enforcement guards (ci_guards.py)
        run: python scripts/ci_guards.py

      # ── Test suite — one step per module ──────────────────────────────────
      - name: "Tests: sessions"
        run: pytest tests/test_sessions.py -v

      - name: "Tests: instruments"
        run: pytest tests/test_instruments.py -v

      - name: "Tests: costs"
        run: pytest tests/test_costs.py -v

      - name: "Tests: validation hardening"
        run: pytest tests/test_validation_hardening.py -v

      - name: "Tests: enforcement layer"
        run: pytest tests/test_enforcement.py -v

      - name: "Tests: gate rejects foreign run_id"
        run: pytest tests/test_gate_rejects_foreign_run_id.py -v

      - name: "Tests: phase 0.6 fixes"
        run: pytest tests/test_phase06_fixes.py -v

      - name: "Tests: battery & CI"
        run: pytest tests/test_battery_and_ci.py -v

      - name: "Tests: CI guards"
        run: pytest tests/test_ci_guards.py -v

      - name: "Tests: backtest engine"
        run: pytest tests/test_engine.py -v

      - name: "Tests: walk-forward pipeline & metrics"
        run: pytest tests/test_walkforward_pipeline.py -v
