name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch/PR on new push
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1: static analysis — ruff format, ruff lint, mypy, ci_guards
  # Fast (~30s). Gate for the expensive jobs below.
  # ────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Format check (ruff format)
        run: ruff format --check src tests

      - name: Lint (ruff check)
        run: ruff check src tests

      - name: Type-check (mypy)
        run: mypy

      - name: Platform enforcement guards
        run: python scripts/ci_guards.py

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2: full test suite — Python 3.12 and 3.13 run in parallel
  # Runs only after lint passes.
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run full test suite
        run: pytest tests/ -v --tb=short

  # ────────────────────────────────────────────────────────────────────────────
  # Job 3: Docker smoke test — verify the production image builds cleanly
  # Runs after all test matrix variants pass.
  # GHA layer cache keeps rebuilds under 60s after the first run.
  # ────────────────────────────────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (smoke test — no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: novaxfx:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
